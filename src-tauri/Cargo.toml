[package]
name = "lightcp"
version = "0.1.0"
description = "A lightweight competitive programming IDE"
authors = ["LightCP contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lightcp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
log = "0.4"
notify = "8.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
thiserror = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The Tauri context embeds the complete frontend in this crate. On the current
# Windows MSVC toolchain, LLVM opt-level 3 can overflow/crash while optimizing
# that generated static data. Dependencies keep the normal release profile;
# only the small LightCP orchestration crate uses the stable, faster build path.
[profile.release.package.lightcp]
opt-level = 1
